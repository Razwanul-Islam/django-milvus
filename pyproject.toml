[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-milvus"
version = "0.2.0"
description = "Django integration for Milvus vector database - use Milvus as a Django secondary database with ORM-like interface"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Md. Razwanul Islam", email="razwanrakib0@gmail.com"},
]
keywords = ["django", "milvus", "vector", "database", "embedding", "similarity-search", "orm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "django>=4.2",
    "pymilvus>=2.4.0,<3.0",
    # Used by the semantic cache for vector similarity. Already present
    # transitively via pymilvus; declared here because the cache imports
    # it directly.
    "numpy>=1.21",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
    "coverage",
    "flake8",
    "mypy",
]
model = [
    "pymilvus[model]",
]
# Shared L2 cache tier.
cache = [
    "redis>=4.2",
]
# Optional accelerators for the cache. None are required: without them
# the cache uses an exact NumPy scan, pickle serialization, no
# compression, and no memory-pressure handling.
fast = [
    "hnswlib>=0.7",
    "lz4>=4.0",
    "msgpack>=1.0",
    "psutil>=5.9",
]

[project.urls]
Homepage = "https://github.com/Razwanul-Islam/django-milvus"
Documentation = "https://github.com/Razwanul-Islam/django-milvus#readme"
Repository = "https://github.com/Razwanul-Islam/django-milvus"
Issues = "https://github.com/Razwanul-Islam/django-milvus/issues"

[tool.setuptools.packages.find]
include = ["django_milvus*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["tests.py", "test_*.py"]
markers = [
    "cache: override MILVUS_CACHE settings for one test",
]
